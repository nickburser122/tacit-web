<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tacit</title>
  <meta name="description" content="Tacit. A quiet start page for the web. Open anything, answer small questions, keep little things. Type, press Enter, done.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ebe9e4" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/tacit.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="search" type="application/opensearchdescription+xml" href="opensearch.xml" title="Tacit">
  <link rel="preload" href="fonts/readex-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/tacit.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <button id="theme-button" class="icon-btn" type="button" aria-label="Switch theme">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.2A7.8 7.8 0 0 1 9.8 4.5a7.8 7.8 0 1 0 9.7 9.7z"/></svg>
  </button>
  <main id="launcher" class="bar-top">
    <header id="hero">
      <div id="hero-clip">
        <div id="hero-body">
          <p id="greeting"></p>
          <div id="clock-block" aria-hidden="true" hidden>
            <div id="clock-time"></div>
            <div id="clock-date"></div>
          </div>
        </div>
      </div>
    </header>

    <form id="search-bar" role="search" autocomplete="off" action="#">
      <label for="search-input" class="visually-hidden">Search</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="search-input" type="search" placeholder="Search" enterkeyhint="go" dir="auto"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
        <kbd class="field-kbd" aria-hidden="true">/</kbd>
      </div>
      <button id="panel-button" class="icon-btn" type="button" aria-label="Panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </form>

    <section id="results-region" aria-label="Results">
      <div id="stack">
        <ul id="results" role="listbox" aria-label="Results"></ul>
        <div id="home" hidden></div>
      </div>
    </section>

    <div id="hint" role="status" aria-live="polite"></div>
  </main>

  <script src="js/normalize.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/sensitive.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/clipaccess.js"></script>
  <script src="js/color.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/compose.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>
  <script>App.init();</script>
</body>
</html>
